name: CI

# Every push is tested. Deployment is not done here: a webhook on the server deploys pushes to dev (see DEPLOY.md).
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: learn
          POSTGRES_DB: learnonline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learn -d learnonline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://learn:learn@localhost:5432/learnonline_test?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: api/package-lock.json,
          }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: client/package-lock.json,
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run build
