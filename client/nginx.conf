server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Built files have a hash in their name, so a file never changes: browsers may keep it for a year.
  # A file that does not exist (an old version after a deploy) must be a real 404, not index.html,
  # otherwise the browser tries to run a web page as a script and fails in a confusing way.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html so client-side routes work on refresh.
  # index.html is never cached, so a new deploy is picked up on the next visit.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
